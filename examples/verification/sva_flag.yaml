# Complete SVA example: an autonomous one-shot flag changes from 0 to 1 and
# then remains set.
#
# Native reference and RTL monitor simulation:
#   nnc-verify examples/verification/sva_flag.yaml --steps 6
#   nnc-gen examples/verification/sva_flag.yaml -t sva --sva-steps 6 -o out/sva_flag
#   cd out/sva_flag
#   iverilog -g2012 -o sim.vvp sva_flag.sv sva_flag_sva.sv sva_flag_tb.sv
#   vvp sim.vvp
#
# Formal checks (run in the output directory):
#   nnc-gen examples/verification/sva_flag.yaml -t sva --sva-mode formal --sva-depth 4 -o out/sva_flag_formal
#   sby -f sva_flag.sby bmc
#   sby -f sva_flag.sby cover
#   sby -f sva_flag.sby prove_kind
#   sby -f sva_flag.sby prove_pdr
#   sby -f sva_flag.sby live
#
# The first four tasks check safety/bounded properties or cover. The live task
# checks reaches_one; it needs the suprove engine. Run tasks by name when that
# engine is unavailable, because running the .sby without a task runs all tasks.
# See docs/sva_workflows.md for expected output, failure and replay tutorials.
module:
  name: sva_flag
  description: Autonomous one-shot flag demonstrating RTL simulation and formal SVA checks
  zero_reset_mode: true

cells:
  - id: 1
    contents:
      - x = 0
    output: [x]

rules:
  - 1 -> x

verilog:
  real_encoding: {kind: fixed_point, signed: true, width: 16, frac_bits: 8}
  ports:
    x: {direction: output, kind: fixed, signed: true, width: 16}

verification:
  properties:
    - id: stays_boolean
      description: x always remains either zero or one
      always: x >= 0 && x <= 1
    - id: reaches_one
      description: every infinite run eventually reaches one
      eventually: x == 1
    - id: reaches_one_quickly
      description: one is reached in the initial row or the next row
      eventually: x == 1
      within: [0, 1]
    - id: zero_is_followed_by_one
      when: x == 0
      then: x == 1
      after: 1
    - id: one_holds_on_its_trigger_row
      when: x == 1
      then: x == 1
      within: [0, 0]
    - id: values_stay_nonnegative_after_one
      when: x == 1
      then_always: x >= 0
    - id: covers_one
      cover: x == 1
