# Imported Python sensor module used by the composed controller example.
module:
  name: python_sensor_reset
  zero_reset_mode: true

cells:
  - id: 1
    contents:
      - raw = 0
      - level = 0
    input: [raw]
    output: [level]

rules:
  - raw + 1 -> level

verilog:
  real_encoding:
    kind: fixed_point
    signed: false
    width: 8
    frac_bits: 0