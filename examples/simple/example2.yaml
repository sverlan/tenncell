 # Example demonstrating all supported rule operators in one scenario.
cells:
  - id: 1
    contents:
      - name: var1
        value: 5
      - name: var2
        value: 10
  - id: 2
    contents:
      - name: var3
        value: 2.5
      - x = 0, y = 3
  -  { id: 3, contents: [z = 5, z2 = 3] }
  - id: 4
    contents: [x4=1.0, x4a=4]
rules:
  - guard: var1 > var2
    producer: var1 + 2 * var2
    consumer: var2
  - guard: var3 > 1 || var1==var2
    producer: var1 / var3
    consumer: var3
  - guard: True
    producer: var1 + 1
    consumer: var1
  - var1 + var2 > 0 | var1 + 1 -> var3
  - var2 + var3 -> var1
  - var1>0 | var2 + var3 -> var1
