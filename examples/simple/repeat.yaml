module:
  name: repeat_example
  description: Demonstrates list-only repeat sugar for variables and rules.
cells:
  - id: 1
    contents:
      - repeat:
          var: i
          range: [0, 3]
          body:
            - x_${i} = 0
    output:
      - x_3
rules:
  - 1 -> x_0
  - repeat:
      var: i
      range: [1, 3]
      body:
        - x_${i-1} + 1 -> x_${i}
