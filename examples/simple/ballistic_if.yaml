module:
  name: ballistic_if
  description: "Example for ballistic motion using if sugar"

constants:
  g: 9.81
  dt: 0.05
  v0: 10
  # angle: 45 deg
  deg: pi()/4

cells:
  - id: 1
    contents:
      - x = 0, y = 0
      - vx = v0 * cos(deg), vy = v0 * sin(deg)
    input: []
    output: [x, y]

rules:
  # Base state reset for the two position variables.
  - 0 * x -> x
  - 0 * y -> y

  # Flight update while the next position stays above ground.
  - if: y + (vy - g * dt) * dt >= 0
    then:
      - vx -> vx
      - vy - g * dt -> vy
      - x + vx * dt -> x
      - y + vy * dt -> y
    else:
  # Clamp the projectile once it would cross the ground.
      - 0 -> vx
      - 0 -> vy
      - y -> y
      - x -> x
