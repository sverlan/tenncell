# Legacy-style TENNCell example used by CLI compute-mode contract tests.
cells:
  - id: 1
    contents:
      - var1 = 5
      - var2 = 10
  - id: 2
    contents:
      - var3 = 2.5
rules:
  - var1 > var2 | var1 + 2 * var2 -> var2
  - (var3 > 1 || var1 == var2) | var1 / var3 -> var3
  - var1 + 1 -> var1
