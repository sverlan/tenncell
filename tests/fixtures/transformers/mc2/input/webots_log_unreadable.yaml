# MC2 queries on a Webots controller whose CSV log MC2 cannot use: no step
# column, comma separator, and a queried input that is not logged.
module:
  name: webots_log_unreadable

cells:
  - id: 1
    contents:
      - s = 0
      - w = 0
      - y = 0
    input: [s]
    output: [y]

rules:
  - s * 2 -> w
  - y * 0 + w -> y

webots:
  bindings:
    s:
      device: ps0
      read_method: getValue
    y:
      device: motor
      write_method: setVelocity
  csv:
    file: log.csv
    variables: [w, y]

verification:
  backends:
    mc2:
      raw:
        - id: weight_follows_sensor
          code: "P=?[ G([${w}] = 2 * [${s}]) ]"
