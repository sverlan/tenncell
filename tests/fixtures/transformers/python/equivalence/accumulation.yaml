# Several weighted inputs accumulate into one consumed variable that a guarded
# rule reads; the guarded rule consumes it only when it is non-zero.
module:
  name: accumulation

cells:
  - id: 1
    contents:
      - a = 0, b = 0, c = 0
      - sum = 0
      - out = 0
    input: [a, b, c]
    output: [out]

rules:
  - a * 0.7 -> sum
  - b * 0.3 -> sum
  - c * 0.11 -> sum
  - out * 0 -> out
  - sum != 0 | sum * 1.5 -> out
  - sum == 0 | 0.1 -> out
