# External device for external_numbers/root.yaml: inputs of each kind, one output.
schema:
  name: dev
  ports:
    - name: clk
      direction: input
      width: 1
      signed: false
    - name: level
      direction: input
      kind: fixed
      width: 16
      signed: true
    - name: en
      direction: input
      width: 1
      signed: false
    - name: mode
      direction: input
      kind: logic
      width: 8
      signed: false
    - name: spare
      direction: input
      width: 4
      signed: false
    - name: zero
      direction: input
      width: 4
      signed: false
    - name: ready
      direction: output
      width: 1
      signed: false
