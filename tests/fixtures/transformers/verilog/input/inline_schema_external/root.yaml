# Verilog fixture: an external module described inline (`schema`, not a header
# file). Its 12-bit signed fixed-point output `sample` feeds the root input u
# (converted to the 16-bit Q8.8 encoding), which a rule reads.
module:
  name: inline_schema_root
verilog:
  clock: clk
  reset: rst
  real_encoding: {kind: fixed_point, signed: true, width: 16, frac_bits: 8}
  ports:
    y: {direction: output, kind: fixed, width: 16, signed: true}
  externals:
    adc0:
      schema:
        name: adc
        ports:
          - {name: clk, direction: input, width: 1, signed: false}
          - {name: sample, direction: output, kind: fixed, width: 12, signed: true}
      connections:
        clk: clk
        sample: u
cells:
  - id: 1
    contents:
      - u = 0
      - y = 0
    input: [u]
    output: [y]
rules:
  - u * 2 -> y
