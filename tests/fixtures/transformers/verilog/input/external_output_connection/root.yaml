module:
  name: root
verilog:
  clock: clk
  reset: rst
  real_encoding:
    kind: fixed_point
    signed: true
    width: 32
    frac_bits: 16
  ports:
    uart_tx:
      direction: output
      width: 1
      signed: false
  externals:
    uart0:
      header: uart_tx.header.yaml
      connections:
        clk: clk
        tx: uart_tx
cells:
  - id: 1
    contents:
      - x = 0
      - uart_tx = 0
    output:
      - uart_tx
rules: []
