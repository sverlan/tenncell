module:
  name: zero_reset_demo
  zero_reset_mode: true
verilog:
  clock: clk
  reset: rst
  real_encoding:
    kind: fixed_point
    signed: true
    width: 32
    frac_bits: 16
  ports:
    y:
      direction: output
      width: 32
      signed: true
cells:
  - id: 1
    contents:
      - x = 5
      - y = 0
    output: [y]
rules:
  - x + 1 -> y
