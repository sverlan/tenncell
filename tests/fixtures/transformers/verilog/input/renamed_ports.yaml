# Verilog fixture: input and output ports renamed with `rename`. Rules must
# read the input through its renamed port (a_in), not its TENNCell name (a).
cells:
  - id: 1
    contents:
      - a = 0
      - x = 0
    input: [a]
    output: [x]

rules:
  - a > 1 | a + x -> x

verilog:
  real_encoding: {kind: fixed_point, signed: true, width: 16, frac_bits: 8}
  ports:
    a: {direction: input, kind: fixed, width: 16, signed: true, rename: a_in}
    x: {direction: output, kind: fixed, width: 16, signed: true, rename: x_out}
