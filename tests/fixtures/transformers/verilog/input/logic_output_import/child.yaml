# Verilog fixture: imported child with a fixed-point output f (3.0, Q8.8) and
# a 4-bit unsigned logic output g (5).
module:
  name: logic_output_child
cells:
  - id: 1
    contents:
      - f = 3
      - g = 5
    output: [f, g]
rules:
  - f -> f
  - g -> g
verilog:
  real_encoding: {kind: fixed_point, signed: true, width: 16, frac_bits: 8}
  ports:
    f: {direction: output, kind: fixed, width: 16, signed: true}
    g: {direction: output, kind: logic, width: 4, signed: false}
