# An init entry whose binding has no write method: a located error.
cells:
  - id: 1
    contents:
      - distance = 0
    input: [distance]
rules: []
# Inputs are supplied externally and cannot be rule destinations.
webots:
  bindings:
    distance:
      device: distance_sensor
      read_method: getValue
  init:
    distance: 1
