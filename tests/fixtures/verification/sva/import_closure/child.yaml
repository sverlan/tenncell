# SVA fixture child (copy of the Verilog renamed_import child).
module:
  name: child
cells:
  - id: 1
    contents:
      - a = 0
      - y = 0
    input: [a]
    output: [y]
rules:
  - a -> y
verilog:
  real_encoding: {kind: fixed_point, signed: true, width: 16, frac_bits: 8}
  ports:
    a: {direction: input, kind: fixed, width: 16, signed: true, rename: a_in}
    y: {direction: output, kind: fixed, width: 16, signed: true, rename: y_out}
