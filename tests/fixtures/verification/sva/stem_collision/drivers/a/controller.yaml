# SVA fixture: one of two imported modules that share the file name
# controller.yaml (in drivers/a and drivers/b).
module:
  name: controller_a
cells:
  - id: 1
    contents:
      - y = 0
    output: [y]
rules:
  - y + 1 -> y
verilog:
  real_encoding: {kind: fixed_point, signed: true, width: 16, frac_bits: 8}
