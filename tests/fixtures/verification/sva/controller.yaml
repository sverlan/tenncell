# SVA selection fixture: a request/grant controller whose properties cover each
# selection outcome of the SVA backend (selected, skipped with a reason,
# native-only, unbounded eventually) plus a raw SVA entry with variable,
# constant and FSM-state placeholders.
module:
  name: sva_controller

constants:
  LIMIT: 10

cells:
  - id: 1
    contents:
      - req = 0
      - ack = 0
      - level = 0
      - mode = 0
    input: [req]
    output: [ack, level]

fsm:
  - name: ctrl
    variable: mode
    initial: IDLE
    states:
      - IDLE:
          rules:
            - if: req > 0
              then:
                - BUSY -> mode
      - BUSY:
          rules:
            - 1 -> ack
            - level + 1 -> level
            - IDLE -> mode

verilog:
  real_encoding: {kind: fixed_point, signed: true, width: 16, frac_bits: 8}
  ports:
    req: {direction: input, kind: fixed, width: 16, signed: true}
    ack: {direction: output, kind: logic, width: 1, signed: false}
    level: {direction: output, kind: fixed, width: 16, signed: true}

verification:
  properties:
    - id: level_bounded
      always: level <= LIMIT
    - id: request_served
      when: req > 0 && mode == ctrl.IDLE
      then: ack == 1
      within: [0, 2]
    - id: reaches_busy
      eventually: mode == ctrl.BUSY
    - id: uses_abs
      always: abs(level) < 100
    - id: level_times_req
      always: level * req < 50
    - id: slow_response
      when: req > 0
      then: ack == 1
      after: 2000
    - id: native_only
      always: level >= 0
      targets: [native]
  backends:
    sva:
      raw:
        - id: level_limit
          code: |
            always @(posedge clk) if (${mode} == ${ctrl.BUSY}) assert (${level} <= ${LIMIT});
