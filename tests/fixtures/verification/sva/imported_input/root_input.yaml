# A root input passed to a child. The input record of a step is written into
# the configuration first (it is the environment's contribution to that step),
# then every import is given values of that configuration: the child receives
# the current record, not the previous one. So on row k the child's copy y and
# the input u hold the same record k. A parent register x copying u matches
# too: both read the record of the step.
module:
  name: imported_input_root_input

imports:
  - module: child.yaml
    as: c0
    connections:
      a: u

cells:
  - id: 1
    contents:
      - u = 0, x = 0
    input: [u]
    output: [x]

rules:
  - u -> x
  - x * 0 -> x

verilog:
  real_encoding: {kind: fixed_point, signed: true, width: 16, frac_bits: 8}
  ports:
    u: {direction: input, kind: fixed, width: 16, signed: true}
    x: {direction: output, kind: fixed, width: 16, signed: true}

verification:
  properties:
    - id: child_gets_this_record
      always: c0.y == u
    - id: parent_gets_this_record
      always: x == u
    - id: child_and_parent_agree
      always: c0.y == x
