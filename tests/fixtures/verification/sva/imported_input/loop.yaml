# Two imports reading each other's output (inc.yaml: y = a + 1). Every import
# reads the configuration before the step, so the cycle needs no ordering:
# step 1 gives both a = 0 (y becomes 1), step 2 gives both a = 1 (y becomes 2).
module:
  name: imported_input_loop

imports:
  - module: inc.yaml
    as: c0
    connections:
      a: c1.y
  - module: inc.yaml
    as: c1
    connections:
      a: c0.y

cells:
  - id: 1
    contents:
      - x = 0
    output: [x]

rules:
  - x -> x

verilog:
  real_encoding: {kind: fixed_point, signed: true, width: 16, frac_bits: 8}

verification:
  properties:
    - id: in_step                 # both are 0, 1, 2, ... together
      always: c0.y == c1.y
    - id: counts_rows
      eventually: c0.y == 3
