# Child for loop.yaml: y becomes its input plus one in every step.
module:
  name: imported_input_inc

cells:
  - id: 1
    contents:
      - a = 0
      - y = 0
    input: [a]
    output: [y]

rules:
  - a + 1 -> y
  - y * 0 -> y

verilog:
  real_encoding: {kind: fixed_point, signed: true, width: 16, frac_bits: 8}
