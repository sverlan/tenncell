# Test-owned verification fixture: FSM counter with MC2 raw queries.
module:
  name: fsm_counter_mc2

constants:
  MAX_COUNT: 3

aliases:
  finished: done

cells:
  - id: 1
    contents:
      - ctrl_state = 0
      - counter = 0
      - start = 0
      - done = 0
    input: [start]
    output: [counter, done]

fsm:
  - name: ctrl
    variable: ctrl_state
    initial: IDLE
    states:
      - IDLE:
          rules:
            - if: start > 0
              then:
                - RUN -> ctrl_state
                - counter * 0 -> counter
                - done * 0 -> done
              else:
                - done * 0 -> done
      - RUN:
          rules:
            - if: counter >= MAX_COUNT
              then:
                - DONE -> ctrl_state
                - 1 -> done
              else:
                - counter + 1 -> counter
      - DONE:
          rules:
            - done -> done

verification:
  environment:
    start: { range: [0, 1] }
  trace_semantics: strict
  properties:
    - id: bounded
      always: counter <= MAX_COUNT
  backends:
    mc2:
      raw:
        - id: reaches_done
          description: The controller eventually raises done
          code: "P=?[ F([${done}] = 1) ]"
        - id: counter_bounded
          code: >-
            P>=1[ G([${counter}] <= ${MAX_COUNT}) ]
        - id: done_state
          code: |
            P=?[ F([${ctrl_state}] = ${ctrl.DONE} ^ [${finished}] = 1) ]
