name: Release

# A release is published by pushing a tag vX.Y.Z that points into main. Nothing else
# starts this workflow. The upload to PyPI waits for the approval of the `pypi`
# environment (restrict that environment to deployments from tags matching v*)
# and uses trusted publishing: no token is stored anywhere.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    name: Check the tag, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The tag points into main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: The tag, the package version and the changelog agree
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/nnc/_version.py)
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} does not match version '${version}'"; exit 1; }
          grep -qx "## ${version}" CHANGELOG.md || { echo "CHANGELOG.md has no section '## ${version}'"; exit 1; }
      - run: python -m pip install pdm==2.29.7
      - run: pdm sync --dev
      - run: pdm run lint
      - run: pdm run typecheck
      - run: pdm run test
      - run: pdm build --dest dist
      - name: The wheel installs and runs
        run: |
          python -m venv "${RUNNER_TEMP}/wheel"
          "${RUNNER_TEMP}/wheel/bin/pip" install dist/*.whl
          "${RUNNER_TEMP}/wheel/bin/nnc-sim" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tenncell
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
