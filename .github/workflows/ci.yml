name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pdm==2.29.7
      - run: pdm sync --dev
      - run: pdm run lint
      - run: pdm run typecheck
      # The opt-in tool tests (Icarus, Verilator, Yosys, Webots, MC2) skip: no NNC_* variable.
      - run: pdm run test

  package:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pdm==2.29.7
      - run: pdm build --dest dist
      - name: The wheel installs and runs
        run: |
          python -m venv "${RUNNER_TEMP}/wheel"
          "${RUNNER_TEMP}/wheel/bin/pip" install dist/*.whl
          "${RUNNER_TEMP}/wheel/bin/nnc-sim" --version
          "${RUNNER_TEMP}/wheel/bin/nnc-gen" --version
          "${RUNNER_TEMP}/wheel/bin/nnc-verify" --version
